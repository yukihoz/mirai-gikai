name: Migrate DB then Deploy

on:
  push:
    branches: [ main, develop ]

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Supabase CLI セットアップ
      - uses: supabase/setup-cli@v1
        with:
          version: 2.24.0

      # Supabase プロジェクトへリンク（ノンインタラクティブ）
      - name: Supabase link
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF --password $SUPABASE_DB_PASSWORD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # マイグレーション適用（idempotent）
      # --yes: CI(非TTY)で確認プロンプト待ちハングを防ぐ（prod に未適用マイグレーションが
      # あると supabase db push が [Y/n] を出して stdin 待ちで停止するため。実際に本番デプロイが
      # db push で数時間ハングした）
      - name: Supabase db push
        run: |
          supabase db push --include-all --password $SUPABASE_DB_PASSWORD
          supabase config push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          ADMIN_AUTH_CALLBACK_URL: ${{ secrets.ADMIN_AUTH_CALLBACK_URL }}

      # 成功したら Vercel デプロイを開始
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -n "${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}" ]; then curl -X POST "${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}"; fi
          if [ -n "${{ secrets.ADMIN_VERCEL_DEPLOY_HOOK_URL }}" ]; then curl -X POST "${{ secrets.ADMIN_VERCEL_DEPLOY_HOOK_URL }}"; fi
